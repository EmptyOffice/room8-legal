---
layout: default
---
<a class="back" href="{{ site.baseurl }}/">&larr; All documents</a>

<article class="doc card">
  <h1>{{ page.title }}</h1>
  {% if page.updated %}<p class="meta">{{ page.updated }}</p>{% endif %}
  {{ content }}
</article>

{% if page.next_title %}
<nav class="doc-next">
  <a href="{{ site.baseurl }}/{{ page.next_url }}"><span>Next</span> {{ page.next_title }} &rarr;</a>
</nav>
{% endif %}
